<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ed"><title>MY STOCK · 雲端版</title><style>
:root{--bg:#f8f4ed;--card:#fffdfa;--ink:#403b36;--muted:#8d847a;--accent:#9c8068;--line:#e9e0d5;--warn:#ae6650}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:650px;margin:auto;padding:25px 18px 115px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;letter-spacing:2px;margin:4px 0}h2{font-size:21px;margin:25px 0 14px}h3{margin:0 0 8px;font-size:16px}p{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.btn{background:var(--accent);border:0;color:white;border-radius:13px;padding:12px 16px;font-weight:600}.soft{background:#f2ebe3;color:var(--ink);border:0;border-radius:12px;padding:10px 13px}.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}.stat,.tile,.item,.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 4px 16px #49382008}.stat strong{display:block;font-size:26px;margin:8px 0 3px}.stat small{color:var(--muted);font-size:12px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{text-align:left;min-height:118px}.tile .emoji{font-size:29px}.tile strong{display:block;margin:9px 0 5px}.tile small{color:var(--muted)}.item{margin:11px 0}.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item p{font-size:13px;margin:4px 0 12px}.tag{font-size:11px;border-radius:100px;padding:5px 9px;background:#f5e5d8;color:#9b684a;white-space:nowrap}.counts{display:flex;gap:14px;color:var(--muted);font-size:13px;margin:12px 0}.counts b{color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:white;margin:12px 0}.filters{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px}.filters button{white-space:nowrap}.filters .selected{background:var(--accent);color:white}.empty{text-align:center;padding:40px 12px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfaee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 0 max(12px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:var(--muted);font-size:12px;min-width:70px}nav button.active{color:var(--accent);font-weight:700}nav span{display:block;font-size:22px;margin-bottom:4px}dialog{width:min(94vw,520px);max-height:90vh;border:0;border-radius:22px;padding:0;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#231b16a0}.modal{padding:22px;overflow:auto;max-height:90vh}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.notice{padding:14px;background:#fff2e9;border-radius:14px;color:#855d45;font-size:13px;line-height:1.6}.subhead{font-size:13px;color:var(--muted);margin:10px 0}.back{border:0;background:none;color:var(--accent);padding:5px 0}.pill{font-size:12px;background:#f1e7dd;border-radius:10px;padding:7px 9px;color:#745c49}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.danger{color:#ad514b}.hidden{display:none!important}.filter-select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);margin:8px 0 12px}.manage-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.manage-row .actions{flex-shrink:0}.manage-row .actions button{padding:8px}.manage-row span{overflow-wrap:anywhere}.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:13px;padding:5px;background:#fff}.stepper button{width:46px;height:46px;border:0;border-radius:10px;background:#f2ebe3;color:var(--ink);font-size:25px;font-weight:600}.stepper output{font-size:22px;font-weight:700;text-align:center;min-width:30px}.stock-preview{background:#f6f0e8;border-radius:14px;padding:13px;margin:12px 0;font-size:14px;line-height:1.8}.stock-preview strong{color:#765a45}.stepper button:disabled{opacity:.3}

.auth{max-width:430px;margin:45px auto}.status{font-size:12px;color:var(--muted);padding:8px 0}.batchline{border-bottom:1px solid var(--line);padding:10px 0}.location-pill{background:#edf1e8;border-radius:9px;padding:5px 9px;font-size:12px;display:inline-block;margin:3px}.choice{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left;margin:7px 0}.choice.selected{border:2px solid var(--accent);background:#f7eee5}.small{font-size:12px;color:var(--muted)}.error{color:#b33}.modal{max-height:86vh;overflow:auto}.stepper{max-width:230px}.hidden{display:none!important}button:disabled{opacity:.45}.login-field{margin:12px 0}.login-field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}.item .actions{margin-top:12px}.chip{border-radius:20px;padding:6px 10px;background:#f2ebe3;display:inline-block;font-size:12px;margin:3px}nav{z-index:2}dialog{z-index:5}main{padding-bottom:130px}</style></head><body><main><header><div><div class="eyebrow">YOUR LITTLE INVENTORY · CLOUD</div><h1>MY STOCK</h1></div><button id="addBtn" class="btn hidden" onclick="openProduct()">＋ 新增</button></header><div id="status" class="status"></div><div id="view"></div></main><nav id="nav" class="hidden"><button onclick="go('home')" data-page="home">⌂<br>首頁</button><button onclick="go('stock')" data-page="stock">▦<br>庫存</button><button onclick="go('restock')" data-page="restock">🛒<br>補貨</button><button onclick="go('settings')" data-page="settings">⚙<br>設定</button></nav><dialog id="dlg"><div class="modal"><div class="topline"><h2 id="dlgTitle" style="margin:0"></h2><button class="ghost" onclick="dlg.close()">✕</button></div><div id="dlgBody"></div></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const defaultCats={"保養類（含洗卸）":["洗面乳","卸妝油","眼唇卸妝","睫毛膏卸除液","化妝水","棉片（擦拭型）","棉片（濕敷型）","精華類","面霜類","唇部去角質","護唇膏","睫毛精華"],"化妝品":["防曬/妝前","定妝噴霧","底妝（粉底液/氣墊粉餅）","提亮餅","修容餅","腮紅","眼影","蜜粉餅","睫毛膏","眼線膠筆","眼影筆","臥蠶筆"],"生活用品類":["牙膏","沐浴乳","洗髮精","髮膜","髮油","頭皮精華","洗衣精","洗衣香豆","洗衣球","化妝棉","一般衛生棉","液體衛生棉","夜用衛生棉","安睡褲","濕紙巾"],"旅行組":["洗髮精","沐浴乳","潤髮乳","髮油","化妝水","棉片（擦拭型）","精華類","乳霜類","洗面乳","身體乳液","護手霜","隱形眼鏡藥水"]};
const URL_SB='https://psiygbmjmsrgdjixoqre.supabase.co';
const KEY_SB='sb_publishable_Pg4DPWNrD9aobj8DkanA1g_Zi8Bc8cc';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(), today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let sb, user=null, cats=[],subs=[],products=[],batches=[],opened=[],page='home',filter='',subfilter='',busy=false,choice='',qty=1,locationChoice='新莊';
function status(t,err=false){$('status').textContent=t;$('status').classList.toggle('error',err)}
function err(e){status('操作失敗：'+(e?.message||e),true);alert('操作失敗：'+(e?.message||e))}
async function req(p){let {data,error}=await p;if(error)throw error;return data}
async function init(){if(!window.supabase){status('無法載入雲端連線套件，請確認網路連線',true);return}sb=window.supabase.createClient(URL_SB,KEY_SB,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data}=await sb.auth.getUser();user=data.user;await refresh();sb.auth.onAuthStateChange((_event,session)=>{const newId=session?.user?.id||null;if(newId!==user?.id){user=session?.user||null;setTimeout(()=>refresh(),0)}})}
async function refresh(){if(!user){$('nav').classList.add('hidden');$('addBtn').classList.add('hidden');status('');loginView();return}try{status('☁️ 正在同步…');let res=await Promise.all(['stock_categories','stock_subcategories','stock_products','stock_batches','stock_opened_stock'].map(t=>req(sb.from(t).select('*').eq('user_id',user.id).limit(10000))));[cats,subs,products,batches,opened]=res;if(!cats.length){await seedCats();return await refresh()}$('nav').classList.remove('hidden');$('addBtn').classList.remove('hidden');status('☁️ 已連接雲端 · '+user.email);render()}catch(e){err(e)}}
function loginView(){$('view').innerHTML=`<div class="panel auth"><h2>☁️ 登入 MY STOCK</h2><p>使用 Email 和密碼，讓庫存儲存在你的 Supabase 帳號。</p><div class="login-field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="your@email.com"></div><div class="login-field"><label>密碼（至少 6 字元）</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn" onclick="auth('in')">登入</button><button class="soft" onclick="auth('up')">建立帳號</button></div><p class="small">建立帳號後，可能需要先到信箱點擊驗證連結。請勿使用 Supabase 專案管理員密碼當作登入密碼。</p></div>`}
async function auth(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return alert('請填寫 Email 和至少 6 字元的密碼');try{status('處理登入中…');if(mode==='up'){await req(sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}));alert('註冊已送出。如果需要驗證，請到信箱點擊驗證連結，再回來登入。')}else{await req(sb.auth.signInWithPassword({email,password}))}let {data}=await sb.auth.getUser();user=data.user;await refresh()}catch(e){err(e)}}
function catName(id){return cats.find(x=>x.id===id)?.name||'未分類'}function subName(id){return subs.find(x=>x.id===id)?.name||'未分類'}
function bs(p){return batches.filter(b=>b.product_id===p.id)}function os(b){return opened.filter(o=>o.batch_id===b.id)}function sealed(p){return bs(p).reduce((s,b)=>s+b.sealed_quantity,0)}function inuse(p){return bs(p).reduce((s,b)=>s+os(b).reduce((v,o)=>v+o.quantity,0),0)}function count(p){return sealed(p)+inuse(p)}function restock(p){return count(p)<=p.restock_threshold}
function expiryFlag(date){if(!date)return '';let d=new Date(today()+'T12:00:00');d.setMonth(d.getMonth()+3);const cutoff=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return date<today()?'已過期':date<=cutoff?'三個月內到期':''}
function nearest(p){return bs(p).filter(b=>(b.sealed_quantity+os(b).reduce((v,o)=>v+o.quantity,0))>0&&b.expiry_date).map(b=>b.expiry_date).sort()[0]||''}
function card(p){let n=nearest(p),loc=bs(p).flatMap(b=>os(b).map(o=>`<span class="location-pill">📍 ${esc(o.location)} · ${esc(b.expiry_date||'無期限')} ×${o.quantity} <button class="ghost" style="padding:4px" onclick="moveStock('${o.id}')">搬移</button></span>`)).join('');return `<article class="item"><div class="item-top"><div><h3>${esc(p.name)}</h3><p>${esc(p.brand)} · ${esc(subName(p.subcategory_id))}${p.pad_length_cm?' · '+p.pad_length_cm+' cm':''}${p.pad_size?' · '+esc(p.pad_size):''}</p></div>${restock(p)?'<span class="tag">待補貨</span>':expiryFlag(n)?'<span class="tag">'+expiryFlag(n)+'</span>':''}</div><div class="counts"><span>未開封 <b>${sealed(p)}</b></span><span>使用中 <b>${inuse(p)}</b></span><span>總計 <b>${count(p)}</b></span></div>${n?'<p class="small">📅 最近到期 '+n+'</p>':''}<div>${loc}</div><div class="actions"><button class="soft" onclick="stockDialog('${p.id}','buy')">＋ 進貨</button><button class="soft" onclick="stockDialog('${p.id}','open')" ${sealed(p)?'':'disabled'}>📦 開封</button><button class="soft" onclick="stockDialog('${p.id}','finish')" ${inuse(p)?'':'disabled'}>✓ 用完</button><button class="ghost" onclick="openProduct('${p.id}')">編輯</button></div></article>`}
function go(p,c='',s=''){page=p;filter=c;subfilter=s;render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home'){let due=products.filter(p=>expiryFlag(nearest(p)));html=`<h2>今天也把生活整理好 ♡</h2><div class="stats"><div class="stat"><small>商品品項</small><strong>${products.length}</strong></div><div class="stat"><small>待補貨</small><strong>${products.filter(restock).length}</strong></div><div class="stat"><small>三個月內到期</small><strong>${due.length}</strong></div></div><h2>我的分類</h2><div class="tiles">${cats.map((c,i)=>`<button class="tile" onclick="go('stock','${c.id}')"><span class="emoji">${['🧴','💄','🧺','🧳'][i%4]}</span><strong>${esc(c.name)}</strong><small>${products.filter(p=>p.category_id===c.id).length} 種</small></button>`).join('')}</div><h2>📅 到期提醒</h2>${due.length?due.map(card).join(''):'<div class="panel">目前沒有三個月內到期的商品</div>'}`}else if(page==='stock'){let list=products.filter(p=>(!filter||p.category_id===filter)&&(!subfilter||p.subcategory_id===subfilter));html=`<h2>全部庫存</h2><select class="filter-select" onchange="go('stock',this.value)"><option value="">全部大分類</option>${cats.map(c=>`<option value="${c.id}" ${filter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${filter?`<select class="filter-select" onchange="go('stock','${filter}',this.value)"><option value="">全部子分類</option>${subs.filter(s=>s.category_id===filter).map(s=>`<option value="${s.id}" ${subfilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}<input class="search" placeholder="搜尋商品名稱或品牌" oninput="document.querySelectorAll('[data-item]').forEach(el=>el.style.display=el.dataset.item.includes(this.value.toLowerCase())?'':'none')">${list.map(p=>`<div data-item="${esc((p.name+' '+p.brand).toLowerCase())}">${card(p)}</div>`).join('')||'<div class="empty">還沒有商品，點右上角新增</div>'}`}else if(page==='restock'){html='<h2>🛒 補貨清單</h2>'+(products.filter(restock).map(card).join('')||'<div class="panel">目前沒有待補貨商品 🎉</div>')}else{html=`<h2>設定與備份</h2><div class="panel"><h3>☁️ 雲端同步</h3><p>登入：${esc(user.email)}</p><button class="soft" onclick="refresh()">重新同步</button> <button class="ghost" onclick="signOut()">登出</button></div><div class="panel" style="margin-top:12px"><h3>分類管理</h3><button class="soft" onclick="manageSubs()">管理子分類</button></div><div class="panel" style="margin-top:12px"><h3>舊版資料搬移</h3><p>先備份舊資料，再匯入雲端。相同商品名稱不會自動合併，避免誤覆蓋。</p><button class="btn" onclick="importDialog()">匯入舊版 JSON</button> <button class="ghost" onclick="exportCloud()">匯出雲端 JSON</button></div><div class="notice" style="margin-top:12px">雲端版需連網。開封、用完與搬移會寫入 Supabase；目前請避免兩支裝置同時操作同一商品，後續可加入交易型 RPC 防止競態。</div>`}$('view').innerHTML=html}
function modal(title,body){$('dlgTitle').textContent=title;$('dlgBody').innerHTML=body;$('dlg').showModal()}
function selectOptions(rows,selected=''){return rows.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.name)}</option>`).join('')}
function updateProductSubs(selected=''){const cid=$('pCat').value;$('pSub').innerHTML=selectOptions(subs.filter(s=>s.category_id===cid),selected);padFields()}
function padFields(){let s=subName($('pSub').value),is=['一般衛生棉','液體衛生棉','夜用衛生棉','安睡褲'].includes(s);$('padFields').classList.toggle('hidden',!is);$('padSizeRow').classList.toggle('hidden',s!=='安睡褲')}
function openProduct(id=''){let p=products.find(x=>x.id===id),cid=p?.category_id||filter||cats[0]?.id||'';modal(p?'編輯商品':'新增商品',`<div class="field"><label>商品名稱 *</label><input id="pName" value="${esc(p?.name||'')}" maxlength="120"></div><div class="field"><label>品牌</label><input id="pBrand" value="${esc(p?.brand||'')}"></div><div class="field"><label>大分類</label><select id="pCat" onchange="updateProductSubs()">${selectOptions(cats,cid)}</select></div><div class="field"><label>子分類</label><select id="pSub" onchange="padFields()"></select></div><div id="padFields" class="hidden"><div class="field"><label>長度（cm）</label><input id="pLength" type="number" step="0.5" min="0.5" value="${p?.pad_length_cm||''}"></div><div class="field" id="padSizeRow"><label>尺寸</label><select id="pSize"><option value="">未設定</option>${['S','M','L','XL','XXL'].map(s=>`<option ${p?.pad_size===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>補貨門檻</label><div class="stepper"><button onclick="step('pThreshold',-1)">−</button><output id="pThreshold">${p?.restock_threshold??1}</output><button onclick="step('pThreshold',1)">＋</button></div></div><div class="field"><label>價格（選填）</label><input id="pPrice" type="number" min="0" step="0.01" value="${p?.price??''}"></div><div class="field"><label>備註</label><input id="pNotes" value="${esc(p?.notes||'')}"></div><div class="modal-actions">${p?`<button class="ghost danger" onclick="deleteProduct('${id}')">刪除</button>`:'<span></span>'}<button class="btn" onclick="saveProduct('${id}')">儲存商品</button></div><p class="small">建立商品後，再按「＋進貨」登記數量與有效期限。</p>`);updateProductSubs(p?.subcategory_id);if(p?.pad_size)$('pSize').value=p.pad_size}
function step(id,d){$(id).textContent=Math.max(id==='aQty'?1:0,Math.min(99999,Number($(id).textContent)+d))}
async function mutate(fn){if(busy)return;busy=true;try{status('☁️ 正在儲存…');await fn();$('dlg').close();await refresh()}catch(e){err(e);await refresh()}finally{busy=false}}
async function saveProduct(id){let name=$('pName').value.trim(),cid=$('pCat').value,sid=$('pSub').value;if(!name||!sid)return alert('請填寫品名並選擇分類');let pad=['一般衛生棉','液體衛生棉','夜用衛生棉','安睡褲'].includes(subName(sid));let obj={user_id:user.id,name,brand:$('pBrand').value.trim(),category_id:cid,subcategory_id:sid,restock_threshold:Number($('pThreshold').textContent),pad_length_cm:pad&&$('pLength').value?Number($('pLength').value):null,pad_size:pad&&subName(sid)==='安睡褲'?$('pSize').value||null:null,price:$('pPrice').value?Number($('pPrice').value):null,notes:$('pNotes').value.trim()};await mutate(async()=>{if(id)await req(sb.from('stock_products').update(obj).eq('id',id).eq('user_id',user.id));else await req(sb.from('stock_products').insert(obj))})}
async function deleteProduct(id){if(!confirm('確定刪除商品及所有庫存批次？此操作無法復原。'))return;await mutate(()=>req(sb.from('stock_products').delete().eq('id',id).eq('user_id',user.id)))}
let activeProduct='',activeAction='';function stockDialog(id,action){activeProduct=id;activeAction=action;choice='';qty=1;locationChoice='新莊';renderStockDialog()}
function selectChoice(v){choice=v;renderStockDialog()}function selectLoc(v){locationChoice=v;renderStockDialog()}
function renderStockDialog(){let p=products.find(p=>p.id===activeProduct),bs0=bs(p).sort((a,b)=>(a.expiry_date||'9999').localeCompare(b.expiry_date||'9999'));let body='';if(activeAction==='buy'){body=`<p>本次進貨數量</p><div class="stepper"><button onclick="step('aQty',-1)">−</button><output id="aQty">${qty}</output><button onclick="step('aQty',1)">＋</button></div><div class="field"><label>📅 有效期限（日曆選擇）</label><input id="aExpiry" type="date"></div><p class="small">未開封不需選擇地點；有效期限可以留空。</p>`}else{let opts=activeAction==='open'?bs0.filter(b=>b.sealed_quantity>0).map(b=>({id:b.id,label:`📅 ${b.expiry_date||'未記錄期限'} · 未開封 ${b.sealed_quantity}`})):bs0.flatMap(b=>os(b).map(o=>({id:o.id,label:`📅 ${b.expiry_date||'未記錄期限'} · 📍 ${o.location} · 使用中 ${o.quantity}`})));if(!opts.length)return alert('沒有可操作的庫存');if(!choice||!opts.some(o=>o.id===choice))choice=opts[0].id;body=`<p>${activeAction==='open'?'⭐ 建議優先開封有效期限最近的批次':'選擇用完哪一罐'}</p>${opts.map((o,i)=>`<button class="choice ${choice===o.id?'selected':''}" onclick="selectChoice('${o.id}')">${i===0&&activeAction==='open'?'⭐ 建議優先 · ':''}${esc(o.label)}</button>`).join('')}${activeAction==='open'?`<p>📍 開封後使用地點</p><div class="two">${['新莊','桃園'].map(x=>`<button class="choice ${locationChoice===x?'selected':''}" onclick="selectLoc('${x}')">🏠 ${x}</button>`).join('')}</div>`:''}`}
body+=`<div class="modal-actions"><button class="ghost" onclick="dlg.close()">取消</button><button class="btn" onclick="commitStock()">確認${activeAction==='buy'?'進貨':activeAction==='open'?'開封':'用完'}</button></div>`;modal(({'buy':'＋ 快速進貨','open':'📦 開封商品','finish':'✓ 使用完畢'})[activeAction]+' · '+p.name,body)}
async function commitStock(){let p=products.find(p=>p.id===activeProduct),action=activeAction;await mutate(async()=>{if(action==='buy'){let amount=Number($('aQty').textContent),expiry=$('aExpiry').value||null;await req(sb.from('stock_batches').insert({user_id:user.id,product_id:p.id,expiry_date:expiry,purchase_date:today(),sealed_quantity:amount}))}else if(action==='open'){let b=batches.find(x=>x.id===choice);if(!b||b.sealed_quantity<1)throw Error('庫存不足');let updated=await req(sb.from('stock_batches').update({sealed_quantity:b.sealed_quantity-1}).eq('id',b.id).eq('user_id',user.id).eq('sealed_quantity',b.sealed_quantity).select('id'));if(!updated.length)throw Error('庫存已變更，請重新整理');try{await req(sb.from('stock_opened_stock').insert({user_id:user.id,batch_id:b.id,location:locationChoice,quantity:1}))}catch(e){await sb.from('stock_batches').update({sealed_quantity:b.sealed_quantity}).eq('id',b.id).eq('user_id',user.id).eq('sealed_quantity',b.sealed_quantity-1);throw e}}else{let o=opened.find(x=>x.id===choice);if(!o)throw Error('找不到使用中庫存');if(o.quantity===1)await req(sb.from('stock_opened_stock').delete().eq('id',o.id).eq('user_id',user.id).eq('quantity',1));else{let result=await req(sb.from('stock_opened_stock').update({quantity:o.quantity-1}).eq('id',o.id).eq('user_id',user.id).eq('quantity',o.quantity).select('id'));if(!result.length)throw Error('庫存已變更，請重新整理')}}})}
async function moveStock(id){let o=opened.find(x=>x.id===id);if(!o)return;let dest=o.location==='新莊'?'桃園':'新莊';if(!confirm(`將這 ${o.quantity} 件使用中的商品從${o.location}移到${dest}？`))return;await mutate(async()=>{await req(sb.from('stock_opened_stock').update({location:dest}).eq('id',id).eq('user_id',user.id))})}
async function seedCats(){if(cats.length)return;let newCats=await req(sb.from('stock_categories').insert(Object.keys(defaultCats).map((name,sort_order)=>({user_id:user.id,name,sort_order}))).select());let subrows=newCats.flatMap(c=>defaultCats[c.name].map((name,sort_order)=>({user_id:user.id,category_id:c.id,name,sort_order})));await req(sb.from('stock_subcategories').insert(subrows))}
async function ensureCats(){if(!cats.length){await seedCats();await refresh()}}
async function manageSubs(){await ensureCats();modal('管理子分類',`<div class="field"><label>大分類</label><select id="mCat" onchange="renderSubs()">${selectOptions(cats)}</select></div><div class="field"><label>新增子分類</label><input id="newSub" placeholder="名稱"></div><button class="btn" onclick="addSub()">＋ 新增</button><div id="subRows"></div>`);renderSubs()}
function renderSubs(){let cid=$('mCat').value;$('subRows').innerHTML=subs.filter(s=>s.category_id===cid).map(s=>`<div class="manage-row"><span>${esc(s.name)}</span><div class="actions"><button class="ghost" onclick="renameSub('${s.id}')">更名</button><button class="ghost danger" onclick="deleteSub('${s.id}')">刪除</button></div></div>`).join('')}
async function addSub(){let name=$('newSub').value.trim(),cid=$('mCat').value;if(!name)return;try{await req(sb.from('stock_subcategories').insert({user_id:user.id,category_id:cid,name}));$('dlg').close();await refresh();manageSubs()}catch(e){err(e)}}
async function renameSub(id){let s=subs.find(s=>s.id===id),name=prompt('新的子分類名稱',s.name)?.trim();if(!name||name===s.name)return;try{await req(sb.from('stock_subcategories').update({name}).eq('id',id).eq('user_id',user.id));$('dlg').close();await refresh();manageSubs()}catch(e){err(e)}}
async function deleteSub(id){if(products.some(p=>p.subcategory_id===id))return alert('此子分類還有商品，請先移動商品');if(subs.filter(s=>s.category_id===subs.find(x=>x.id===id).category_id).length<2)return alert('至少保留一個子分類');if(!confirm('確定刪除子分類？'))return;try{await req(sb.from('stock_subcategories').delete().eq('id',id).eq('user_id',user.id));$('dlg').close();await refresh();manageSubs()}catch(e){err(e)}}
async function signOut(){if(confirm('確定登出？雲端商品資料不會刪除。'))await sb.auth.signOut()}
function exportCloud(){let data={version:'cloud-1',exportedAt:new Date().toISOString(),cats,subs,products,batches,opened};downloadJSON(data,'my-stock-cloud-backup.json')}
function downloadJSON(data,name){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function importDialog(){modal('匯入舊版資料',`<p>請選擇舊版 MY STOCK 匯出的 JSON 備份。匯入會新增商品，不會清空雲端現有資料。</p><div class="field"><input id="importFile" type="file" accept=".json,application/json"></div><div class="field"><label>舊版「未設定」使用地點的預設地點（匯入後請核對）</label><select id="importDefaultLocation"><option>新莊</option><option>桃園</option></select></div><div class="notice">請先保留原始備份。舊版若只有總數，會以「未記錄期限」匯入。</div><div class="modal-actions"><button class="ghost" onclick="dlg.close()">取消</button><button class="btn" onclick="importLegacy()">開始匯入</button></div>`)}
async function importLegacy(){let file=$('importFile').files[0];if(!file)return alert('請選擇 JSON 檔');let fallbackLocation=$('importDefaultLocation').value;let data;try{data=JSON.parse(await file.text());if(!Array.isArray(data.items))throw Error('不是舊版 MY STOCK JSON')}catch(e){return err(e)}if(!confirm(`將 ${data.items.length} 種商品新增到雲端？請先確認沒有重複匯入。`))return;await mutate(async()=>{if(!cats.length){await seedCats();let [a,b]=await Promise.all([req(sb.from('stock_categories').select('*').eq('user_id',user.id)),req(sb.from('stock_subcategories').select('*').eq('user_id',user.id))]);cats=a;subs=b}for(let i of data.items){let c=cats.find(c=>c.name===i.category);if(!c)continue;let s=subs.find(s=>s.category_id===c.id&&s.name===i.subcategory);if(!s){let r=await req(sb.from('stock_subcategories').insert({user_id:user.id,category_id:c.id,name:i.subcategory}).select());s=r[0];subs.push(s)}let r=await req(sb.from('stock_products').insert({user_id:user.id,category_id:c.id,subcategory_id:s.id,name:i.name,brand:i.brand||'',restock_threshold:Number(i.threshold)||0,pad_length_cm:i.padLength?Number(i.padLength):null,pad_size:i.padSize||null,price:i.price?Number(i.price):null,notes:i.notes||''}).select());let pid=r[0].id;let old=Array.isArray(i.batches)&&i.batches.length?i.batches:[{sealed:Number(i.sealed)||0,opened:Number(i.opened)||0,expiry:i.expiry||'',location:'未設定'}];for(let b of old){let seal=Math.max(0,Number(b.sealed)||0),op=Math.max(0,Number(b.opened)||0);if(!seal&&!op)continue;let row=await req(sb.from('stock_batches').insert({user_id:user.id,product_id:pid,expiry_date:b.expiry||null,purchase_date:/^\d{4}-\d{2}-\d{2}$/.test(b.purchased||'')?b.purchased:today(),sealed_quantity:seal}).select());if(op){let loc=['新莊','桃園'].includes(b.location)?b.location:fallbackLocation;await req(sb.from('stock_opened_stock').insert({user_id:user.id,batch_id:row[0].id,location:loc,quantity:op}))}}}alert('匯入完成！舊資料中未設定的使用地點依你選擇的預設地點登記，請逐一核對。')})}
init().then(async()=>{if(user&&!cats.length){try{await ensureCats()}catch(e){err(e)}}});
</script></body></html>
