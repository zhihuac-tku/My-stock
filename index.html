<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ed"><title>MY STOCK</title><style>
:root{--bg:#f8f4ed;--card:#fffdfa;--ink:#403b36;--muted:#8d847a;--accent:#9c8068;--line:#e9e0d5;--warn:#ae6650}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:650px;margin:auto;padding:25px 18px 115px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;letter-spacing:2px;margin:4px 0}h2{font-size:21px;margin:25px 0 14px}h3{margin:0 0 8px;font-size:16px}p{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.btn{background:var(--accent);border:0;color:white;border-radius:13px;padding:12px 16px;font-weight:600}.soft{background:#f2ebe3;color:var(--ink);border:0;border-radius:12px;padding:10px 13px}.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}.stat,.tile,.item,.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 4px 16px #49382008}.stat strong{display:block;font-size:26px;margin:8px 0 3px}.stat small{color:var(--muted);font-size:12px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{text-align:left;min-height:118px}.tile .emoji{font-size:29px}.tile strong{display:block;margin:9px 0 5px}.tile small{color:var(--muted)}.item{margin:11px 0}.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item p{font-size:13px;margin:4px 0 12px}.tag{font-size:11px;border-radius:100px;padding:5px 9px;background:#f5e5d8;color:#9b684a;white-space:nowrap}.counts{display:flex;gap:14px;color:var(--muted);font-size:13px;margin:12px 0}.counts b{color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:white;margin:12px 0}.filters{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px}.filters button{white-space:nowrap}.filters .selected{background:var(--accent);color:white}.empty{text-align:center;padding:40px 12px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfaee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 0 max(12px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:var(--muted);font-size:12px;min-width:70px}nav button.active{color:var(--accent);font-weight:700}nav span{display:block;font-size:22px;margin-bottom:4px}dialog{width:min(94vw,520px);max-height:90vh;border:0;border-radius:22px;padding:0;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#231b16a0}.modal{padding:22px;overflow:auto;max-height:90vh}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.notice{padding:14px;background:#fff2e9;border-radius:14px;color:#855d45;font-size:13px;line-height:1.6}.subhead{font-size:13px;color:var(--muted);margin:10px 0}.back{border:0;background:none;color:var(--accent);padding:5px 0}.pill{font-size:12px;background:#f1e7dd;border-radius:10px;padding:7px 9px;color:#745c49}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.danger{color:#ad514b}.hidden{display:none!important}.filter-select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);margin:8px 0 12px}.manage-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.manage-row .actions{flex-shrink:0}.manage-row .actions button{padding:8px}.manage-row span{overflow-wrap:anywhere}.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:13px;padding:5px;background:#fff}.stepper button{width:46px;height:46px;border:0;border-radius:10px;background:#f2ebe3;color:var(--ink);font-size:25px;font-weight:600}.stepper output{font-size:22px;font-weight:700;text-align:center;min-width:30px}.stock-preview{background:#f6f0e8;border-radius:14px;padding:13px;margin:12px 0;font-size:14px;line-height:1.8}.stock-preview strong{color:#765a45}.stepper button:disabled{opacity:.3}
</style></head><body><main><header><div><div class="eyebrow">YOUR LITTLE INVENTORY</div><h1>MY STOCK</h1></div><button class="btn" onclick="openForm()">＋ 新增</button></header><div id="view"></div></main><nav id="nav"><button data-page="home" class="active" onclick="go('home')"><span>⌂</span>首頁</button><button data-page="stock" onclick="go('stock')"><span>▦</span>庫存</button><button data-page="restock" onclick="go('restock')"><span>🛒</span>補貨</button><button data-page="settings" onclick="go('settings')"><span>⚙</span>設定</button></nav><dialog id="editor"><form class="modal" id="form"><div class="topline"><h2 id="formTitle" style="margin:0">新增商品</h2><button type="button" class="ghost" onclick="editor.close()">✕</button></div><input type="hidden" id="itemId"><div class="field"><label>商品名稱 *</label><input id="name" required maxlength="120" placeholder="例如：B5 修復霜"></div><div class="field"><label>品牌</label><input id="brand" maxlength="80" placeholder="選填"></div><div class="field"><label>大分類 *</label><select id="category" onchange="updateSub()"></select></div><div class="field"><label>子分類 *</label><select id="subcategory" onchange="updatePadSpecs()"></select></div><div class="field hidden" id="padSpecs"><label for="padLength">📏 長度（公分）</label><div class="two"><input id="padLength" type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="例如 24、28、35"><select id="padSize"><option value="">尺寸（選填）</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option></select></div><small>一般／液體／夜用衛生棉可填公分數；安睡褲可選尺寸。</small></div><div class="two"><div class="field"><label>📦 未開封數量</label><div class="stepper"><button type="button" onclick="stepQty('sealed',-1)" aria-label="未開封減一">−</button><output id="sealedDisplay">1</output><button type="button" onclick="stepQty('sealed',1)" aria-label="未開封加一">＋</button></div><input id="sealed" type="hidden" value="1"></div><div class="field"><label>🟢 使用中數量</label><div class="stepper"><button type="button" onclick="stepQty('opened',-1)" aria-label="使用中減一">−</button><output id="openedDisplay">0</output><button type="button" onclick="stepQty('opened',1)" aria-label="使用中加一">＋</button></div><input id="opened" type="hidden" value="0"></div></div><div class="stock-preview" id="stockPreview" aria-live="polite"></div><div class="field"><label>補貨門檻（總庫存 ≤ 此數量）</label><div class="stepper"><button type="button" onclick="stepQty('threshold',-1)" aria-label="補貨門檻減一">−</button><output id="thresholdDisplay">1</output><button type="button" onclick="stepQty('threshold',1)" aria-label="補貨門檻加一">＋</button></div><input id="threshold" type="hidden" value="1"></div><div class="two"><div class="field"><label>有效期限</label><input id="expiry" type="date"></div><div class="field"><label>購買日期</label><input id="purchased" type="date"></div></div><div class="field"><label>購買價格（NT$）</label><input id="price" type="number" min="0" step="0.01" placeholder="選填"></div><div class="field"><label>備註</label><input id="notes" placeholder="選填"></div><div class="modal-actions"><button type="button" id="deleteBtn" class="ghost danger hidden" onclick="removeItem()">刪除商品</button><span></span><button class="btn" type="submit">儲存商品</button></div></form></dialog><dialog id="catEditor"><div class="modal"><div class="topline"><h2 style="margin:0">管理子分類</h2><button class="ghost" onclick="catEditor.close()">✕</button></div><div class="field"><label>大分類</label><select id="manageCategory" onchange="renderCategoryManager()"></select></div><div class="field"><label>新增子分類</label><div class="row"><input id="newSub" maxlength="60" placeholder="輸入新子分類名稱"><button class="btn" onclick="addSubcategory()" style="white-space:nowrap">＋ 新增</button></div></div><div id="subManagerList"></div><p style="font-size:12px">有商品的子分類無法直接刪除，請先將商品移到其他子分類。</p></div></dialog><script>
const defaultCats={"保養類（含洗卸）":["洗面乳","卸妝油","眼唇卸妝","睫毛膏卸除液","化妝水","棉片（擦拭型）","棉片（濕敷型）","精華類","面霜類","唇部去角質","護唇膏","睫毛精華"],"化妝品":["防曬/妝前","定妝噴霧","底妝（粉底液/氣墊粉餅）","提亮餅","修容餅","腮紅","眼影","蜜粉餅","睫毛膏","眼線膠筆","眼影筆","臥蠶筆"],"生活用品類":["牙膏","沐浴乳","洗髮精","髮膜","髮油","頭皮精華","洗衣精","洗衣香豆","洗衣球","化妝棉","一般衛生棉","液體衛生棉","夜用衛生棉","安睡褲","濕紙巾"],"旅行組":["洗髮精","沐浴乳","潤髮乳","髮油","化妝水","棉片（擦拭型）","精華類","乳霜類","洗面乳","身體乳液","護手霜","隱形眼鏡藥水"]};let cats=JSON.parse(JSON.stringify(defaultCats));try{const stored=JSON.parse(localStorage.getItem('mystock-cats-v2')||'null');if(stored&&typeof stored==='object')for(const c of Object.keys(defaultCats)){if(Array.isArray(stored[c]))cats[c]=[...new Set(stored[c].filter(x=>typeof x==='string'&&x.trim()))]}}catch{}const icons=['🧴','💄','🧺','🧳'];const key='mystock-v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(items))items=[]}catch{items=[]}let page='home',catFilter='',subFilter='',query='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=i=>i.sealed+i.opened;const needs=i=>total(i)<=i.threshold;let expiring=i=>i.expiry&&new Date(i.expiry+'T23:59:59')<=new Date(Date.now()+30*86400000);const save=()=>{localStorage.setItem(key,JSON.stringify(items));render()};function go(p,c='',s=''){page=p;catFilter=c;subFilter=s;query='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function card(i){return `<article class="item"><div class="item-top"><div><h3>${esc(i.name)}</h3><p>${esc(i.brand?i.brand+' · ':'')}${esc(i.subcategory)}${i.expiry?' · 到期 '+esc(i.expiry):''}</p></div>${needs(i)?'<span class="tag">待補貨</span>':expiring(i)?'<span class="tag">即將到期</span>':''}</div><div class="counts"><span>未開封 <b>${i.sealed}</b></span><span>使用中 <b>${i.opened}</b></span><span>總計 <b>${total(i)}</b></span></div><div class="actions"><button class="soft" onclick="change('${i.id}','buy')">＋ 購入 1 件</button><button class="soft" onclick="change('${i.id}','open')" ${i.sealed<1?'disabled':''}>📦 開封 1 件</button><button class="soft" onclick="change('${i.id}','finish')" ${i.opened<1?'disabled':''}>✓ 用完 1 件</button><button class="ghost" onclick="openForm('${i.id}')">編輯</button></div></article>`}function render(){let v='';if(page==='home'){let rest=items.filter(needs),soon=items.filter(expiring);v=`<h2>今天也把生活整理好 ♡</h2><div class="stats"><div class="stat"><small>商品品項</small><strong>${items.length}</strong><small>種</small></div><div class="stat"><small>待補貨</small><strong>${rest.length}</strong><small>種</small></div><div class="stat"><small>30 天內到期</small><strong>${soon.length}</strong><small>種</small></div></div><div class="topline"><h2>我的分類</h2><span class="pill">4 大分類</span></div><div class="tiles">${Object.keys(cats).map((c,n)=>`<button class="tile" onclick="go('stock',${JSON.stringify(c).replace(/"/g,'&quot;')})"><span class="emoji">${icons[n]}</span><strong>${esc(c)}</strong><small>${items.filter(i=>i.category===c).length} 種商品 · ${cats[c].length} 個子分類</small></button>`).join('')}</div><div class="topline"><h2>需要補貨</h2><button class="back" onclick="go('restock')">查看全部 →</button></div>${rest.length?rest.slice(0,3).map(card).join(''):'<div class="panel"><p>目前沒有需要補貨的商品 ✨</p></div>'}`}else if(page==='stock'){let list=items.filter(i=>(!catFilter||i.category===catFilter)&&(!subFilter||i.subcategory===subFilter)&&(!query||`${i.name} ${i.brand} ${i.subcategory}`.toLowerCase().includes(query.toLowerCase())));v=`${catFilter?'<button class="back" onclick="go(\'stock\')">← 全部分類</button>':''}<div class="topline"><h2>${esc(subFilter||catFilter||'全部庫存')}</h2><span class="pill">${list.length} 種</span></div><input class="search" id="search" placeholder="搜尋品名、品牌、子分類" value="${esc(query)}" oninput="searchStock(this.value)">${catFilter?`<div class="row"><label for="subSelect" class="subhead">子分類</label><button class="back" onclick="openCategoryManager(${JSON.stringify(catFilter).replace(/"/g,'&quot;')})">⚙ 管理子分類</button></div><select id="subSelect" class="filter-select" onchange="filterStock(this.value)"><option value="全部">全部子分類</option>${cats[catFilter].map(c=>`<option value="${esc(c)}" ${subFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`:`<select class="filter-select" aria-label="選擇大分類" onchange="filterStock(this.value)"><option value="全部">全部大分類</option>${Object.keys(cats).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>`}${list.length?list.map(card).join(''):'<div class="empty">還沒有符合條件的商品。<br><br><button class="btn" onclick="openForm()">＋ 新增商品</button></div>'}`}else if(page==='restock'){let list=items.filter(needs);v=`<div class="topline"><h2>🛒 補貨清單</h2><span class="pill">${list.length} 種</span></div><p>當商品總庫存小於或等於補貨門檻時，會自動出現在這裡。</p>${list.length?list.map(card).join(''):'<div class="empty">目前沒有待補貨商品 🎉</div>'}`}else{v=`<h2>設定與資料備份</h2><div class="panel"><h3>目前是手機預覽版</h3><p>資料暫存在這個瀏覽器中，尚未連接雲端。請定期匯出備份；清除網站資料可能導致紀錄消失。</p><button class="btn" onclick="exportData()">匯出 JSON 備份</button><div style="margin-top:16px"><label class="ghost" style="display:inline-block">匯入 JSON 備份<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div></div><div class="panel" style="margin-top:15px"><h3>分類設定</h3><p>可自行新增、重新命名及刪除子分類。</p><button class="btn" onclick="openCategoryManager()">⚙ 管理子分類</button><div class="notice">雲端登入、跨裝置同步、條碼辨識及推播提醒尚未啟用。此版本可先試用庫存流程。</div></div>`} $('view').innerHTML=v}function filterStock(c){if(catFilter)subFilter=c==='全部'?'':c;else {catFilter=c==='全部'?'':c;subFilter=''}render()}function searchStock(q){query=q;const pos=$('search').selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}function updateSub(selected){const c=$('category').value;$('subcategory').innerHTML=(cats[c]||[]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(selected&&cats[c].includes(selected))$('subcategory').value=selected;updatePadSpecs()}function openForm(id){$('form').reset();$('itemId').value=id||'';$('category').innerHTML=Object.keys(cats).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');let i=items.find(x=>x.id===id);$('formTitle').textContent=i?'編輯商品':'新增商品';$('deleteBtn').classList.toggle('hidden',!i);$('category').value=i?.category||catFilter||Object.keys(cats)[0];updateSub(i?.subcategory||subFilter);for(const f of ['name','brand','sealed','opened','threshold','expiry','purchased','price','notes'])$(f).value=i?.[f]??({sealed:1,opened:0,threshold:1}[f]??'');$('padLength').value=i?.padLength??'';$('padSize').value=i?.padSize??'';updatePadSpecs();refreshQty();$('editor').showModal()}function stepQty(field,delta){const el=$(field);const n=Math.max(0,Math.min(99999,(Number(el.value)||0)+delta));el.value=n;refreshQty()}
function refreshQty(){for(const f of ['sealed','opened','threshold']){$(f+'Display').textContent=String(Number($(f).value)||0)}const sealed=Number($('sealed').value)||0,opened=Number($('opened').value)||0,threshold=Number($('threshold').value)||0,total=sealed+opened;$('stockPreview').innerHTML=`<strong>目前庫存：${total} 件</strong><br>📦 未開封 ${sealed} 件　｜　🟢 使用中 ${opened} 件<br>${total<=threshold?'🛒 已達補貨門檻，將顯示在補貨清單':'✓ 庫存充足，暫不需補貨'}`}
$('form').addEventListener('submit',e=>{e.preventDefault();const id=$('itemId').value;let obj={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),name:$('name').value.trim(),brand:$('brand').value.trim(),category:$('category').value,subcategory:$('subcategory').value,sealed:Number($('sealed').value),opened:Number($('opened').value),threshold:Number($('threshold').value),expiry:$('expiry').value,purchased:$('purchased').value,price:$('price').value,notes:$('notes').value.trim(),padLength:isPad()?$('padLength').value:'',padSize:isPad()?$('padSize').value:''};if(!obj.name||[obj.sealed,obj.opened,obj.threshold].some(n=>!Number.isInteger(n)||n<0)){alert('請填寫商品名稱與正確的非負整數數量');return}if(id){const previous=items.find(i=>i.id===id);if(previous?.batches){obj.batches=previous.batches;obj.sealed=previous.sealed;obj.opened=previous.opened}items=items.map(i=>i.id===id?obj:i)}else {obj.batches=[];if(obj.sealed>0)obj.batches.push({id:'legacy-'+Date.now()+'-s',expiry:obj.expiry||'',sealed:obj.sealed,opened:0,location:''});if(obj.opened>0)obj.batches.push({id:'legacy-'+Date.now()+'-o',expiry:obj.expiry||'',sealed:0,opened:obj.opened,location:'未設定'});items.unshift(obj)}$('editor').close();save()});function change(id,action){const i=items.find(x=>x.id===id);if(!i)return;if(action==='buy')i.sealed++;if(action==='open'&&i.sealed>0){i.sealed--;i.opened++}if(action==='finish'&&i.opened>0)i.opened--;save()}function removeItem(){const id=$('itemId').value;if(confirm('確定刪除這項商品？')){items=items.filter(i=>i.id!==id);$('editor').close();save()}}function persistCats(){localStorage.setItem('mystock-cats-v2',JSON.stringify(cats));renderCategoryManager();render()}
function openCategoryManager(category){$('manageCategory').innerHTML=Object.keys(cats).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('manageCategory').value=category||catFilter||Object.keys(cats)[0];$('newSub').value='';renderCategoryManager();$('catEditor').showModal()}
function renderCategoryManager(){const c=$('manageCategory').value;$('subManagerList').innerHTML=cats[c].map((name,n)=>`<div class="manage-row"><span>${esc(name)}</span><div class="actions"><button class="ghost" onclick="renameSubcategory(${n})">更名</button><button class="ghost danger" onclick="deleteSubcategory(${n})">刪除</button></div></div>`).join('')}
function addSubcategory(){const c=$('manageCategory').value,n=$('newSub').value.trim();if(!n){alert('請輸入子分類名稱');return}if(cats[c].includes(n)){alert('這個子分類已經存在');return}cats[c].push(n);$('newSub').value='';persistCats()}
function renameSubcategory(index){const c=$('manageCategory').value,old=cats[c][index];const result=prompt('修改子分類名稱',old);if(result===null)return;const n=result.trim();if(!n){alert('名稱不能空白');return}if(n!==old&&cats[c].includes(n)){alert('這個子分類已經存在');return}cats[c][index]=n;items.forEach(i=>{if(i.category===c&&i.subcategory===old)i.subcategory=n});if(catFilter===c&&subFilter===old)subFilter=n;localStorage.setItem(key,JSON.stringify(items));persistCats()}
function deleteSubcategory(index){const c=$('manageCategory').value,n=cats[c][index];if(items.some(i=>i.category===c&&i.subcategory===n)){alert('這個子分類還有商品，請先將商品移到其他子分類後再刪除。');return}if(cats[c].length<=1){alert('每個大分類至少要保留一個子分類');return}if(!confirm('確定刪除「'+n+'」？'))return;cats[c].splice(index,1);if(catFilter===c&&subFilter===n)subFilter='';persistCats()}
function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),items,cats},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-stock-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.cats&&typeof data.cats==='object'){for(const c of Object.keys(defaultCats)){if(Array.isArray(data.cats[c]))cats[c]=[...new Set(data.cats[c].filter(x=>typeof x==='string'&&x.trim()))]}}if(!Array.isArray(data.items)||!data.items.every(i=>typeof i.name==='string'&&cats[i.category]?.includes(i.subcategory)&&Number.isInteger(i.sealed)&&i.sealed>=0&&Number.isInteger(i.opened)&&i.opened>=0&&Number.isInteger(i.threshold)&&i.threshold>=0))throw Error('備份格式不正確');if(confirm('匯入將覆蓋目前所有商品，確定繼續？')){items=data.items;localStorage.setItem('mystock-cats-v2',JSON.stringify(cats));save();alert('匯入完成')}}catch(err){alert('無法匯入：'+err.message)}e.target.value=''}render();
</script>
<style>
.batchline{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.batchline small{display:block;color:var(--muted);margin-top:5px}.location-pill{display:inline-block;background:#e8f0e8;border-radius:8px;padding:3px 7px;margin:3px;font-size:12px}.action-label{font-size:14px;color:var(--muted);margin:8px 0}.choice{display:block;width:100%;padding:14px;margin:9px 0;text-align:left;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.choice.chosen{border:2px solid var(--accent);background:#f7eee5}.quick-row{display:flex;gap:8px;align-items:center;justify-content:space-between}.quick-row button{min-width:44px;min-height:44px}.subtle{font-size:12px;color:var(--muted)}
</style>
<dialog id="actionDialog"><div class="modal"><div class="topline"><h2 id="actionTitle" style="margin:0">庫存操作</h2><button class="ghost" type="button" onclick="$('actionDialog').close()">✕</button></div><div id="actionBody"></div><div class="modal-actions"><button class="ghost" type="button" onclick="$('actionDialog').close()">取消</button><button class="btn" type="button" id="actionConfirm" onclick="confirmStockAction()">確認</button></div></div></dialog>
<script>
// V4: retain the original localStorage keys and migrate old aggregate counts safely.
let currentAction=null, selectedBatch=null, selectedLocation='新莊', actionQty=1;
const dayString=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const uid=()=>globalThis.crypto?.randomUUID?.()||('b'+Date.now()+Math.random().toString(36).slice(2));
function normalizedBatches(i){
 if(!Array.isArray(i.batches)){
  i.batches=[];
  if(Number(i.sealed)>0)i.batches.push({id:uid(),expiry:i.expiry||'',sealed:i.sealed,opened:0,location:'',legacy:true});
  if(Number(i.opened)>0)i.batches.push({id:uid(),expiry:i.expiry||'',sealed:0,opened:i.opened,location:'未設定',legacy:true});
 }
 i.batches.forEach(b=>{b.sealed=Math.max(0,Number(b.sealed)||0);b.opened=Math.max(0,Number(b.opened)||0);b.expiry=b.expiry||'';b.location=b.location||((b.opened>0)?'未設定':'')});
 syncCounts(i);return i.batches;
}
function syncCounts(i){i.sealed=(i.batches||[]).reduce((a,b)=>a+(Number(b.sealed)||0),0);i.opened=(i.batches||[]).reduce((a,b)=>a+(Number(b.opened)||0),0)}
items.forEach(normalizedBatches);
localStorage.setItem(key,JSON.stringify(items));
function expirationState(date){if(!date)return '';const today=dayString();if(date<today)return '已過期';let d=new Date(today+'T12:00:00');d.setMonth(d.getMonth()+3);const limit=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return date<=limit?'三個月內到期':''}
function earliest(i){return (i.batches||[]).filter(b=>b.sealed+b.opened>0&&b.expiry).map(b=>b.expiry).sort()[0]||''}
function batchSort(a,b){return (a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31')}
function cardV4(i){normalizedBatches(i);const due=earliest(i),warning=due&&expirationState(due);const locs=(i.batches||[]).filter(b=>b.opened>0).map(b=>`<span class="location-pill">📍 ${esc(b.location)} · ${esc(b.expiry||'未記錄期限')} ×${b.opened}</span>`).join('');return `<article class="item"><div class="item-top"><div><h3>${esc(i.name)}</h3><p>${esc(i.brand?i.brand+' · ':'')}${esc(i.subcategory)}</p></div>${needs(i)?'<span class="tag">待補貨</span>':warning?`<span class="tag">${warning}</span>`:''}</div><div class="counts"><span>未開封 <b>${i.sealed}</b></span><span>使用中 <b>${i.opened}</b></span><span>總計 <b>${total(i)}</b></span></div>${due?`<div class="subtle">📅 最近有效期限：${esc(due)} ${warning?'· '+warning:''}</div>`:''}${locs?`<div style="margin:9px 0">${locs}</div>`:''}<div class="actions" style="margin-top:12px"><button class="soft" onclick="stockAction('${i.id}','buy')">＋ 進貨</button><button class="soft" onclick="stockAction('${i.id}','open')" ${i.sealed<1?'disabled':''}>📦 開封</button><button class="soft" onclick="stockAction('${i.id}','finish')" ${i.opened<1?'disabled':''}>✓ 用完</button><button class="ghost" onclick="openForm('${i.id}')">編輯</button></div></article>`}
// Override card and expiry helpers without changing the original navigation and categories.
card=cardV4;
expiring=i=>(i.batches||[]).some(b=>b.sealed+b.opened>0&&b.expiry&&expirationState(b.expiry));
const oldRender=render;
render=function(){oldRender();if(page==='home'){
 const stats=document.querySelectorAll('.stat');if(stats[2])stats[2].querySelector('small').textContent='三個月內到期';
 const soon=items.filter(expiring);if(soon.length){$('view').insertAdjacentHTML('beforeend',`<div class="topline"><h2>📅 到期提醒</h2><span class="pill">${soon.length} 種</span></div>${soon.slice(0,5).map(card).join('')}`)}
 }};
function stockAction(id,action){const i=items.find(x=>x.id===id);if(!i)return;normalizedBatches(i);currentAction={id,action};selectedBatch=null;selectedLocation='新莊';actionQty=1;const titles={buy:'＋ 快速進貨',open:'📦 開封商品',finish:'✓ 使用完畢'};$('actionTitle').textContent=titles[action]+' · '+i.name;renderStockAction()}
function adjustActionQty(delta){actionQty=Math.max(1,Math.min(999,actionQty+delta));renderStockAction()}
function selectStockBatch(id){selectedBatch=id;renderStockAction()}
function selectStockLocation(loc){selectedLocation=loc;renderStockAction()}
function renderStockAction(){const i=items.find(x=>x.id===currentAction.id),action=currentAction.action;let html='';if(action==='buy'){
 html=`<p class="action-label">本次購入幾件？</p><div class="stepper"><button type="button" onclick="adjustActionQty(-1)">−</button><output>${actionQty}</output><button type="button" onclick="adjustActionQty(1)">＋</button></div><div class="field"><label for="actionExpiry">📅 本次進貨有效期限（日曆選擇）</label><input type="date" id="actionExpiry" value="${window.lastActionExpiry||''}"></div><div class="notice">同款商品不同有效期限會分批記錄。沒有期限也可以先進貨，之後再補登。</div>`;
 }else{
 const eligible=i.batches.filter(b=>action==='open'?b.sealed>0:b.opened>0).sort(batchSort);if(!eligible.length){html='<p>目前沒有可操作的庫存。</p>';}
 else{if(!eligible.some(b=>b.id===selectedBatch))selectedBatch=eligible[0].id;html=`<p class="action-label">${action==='open'?'⭐ 建議優先開封最早到期的批次。請確認手上商品的日期：':'選擇這次用完的那一罐：'}</p>`+eligible.map((b,idx)=>`<button type="button" class="choice ${selectedBatch===b.id?'chosen':''}" onclick="selectStockBatch('${b.id}')">${idx===0&&action==='open'?'⭐ 建議優先 · ':''}📅 ${esc(b.expiry||'未記錄期限')} · ${action==='open'?'未開封':'使用中'} ${action==='open'?b.sealed:b.opened} 件 ${action==='finish'?'· 📍 '+esc(b.location):''}</button>`).join('');if(action==='open'){html+=`<p class="action-label">📍 開封後放在哪裡？</p><div class="two">${['新莊','桃園'].map(loc=>`<button type="button" class="choice ${selectedLocation===loc?'chosen':''}" onclick="selectStockLocation('${loc}')">🏠 ${loc}</button>`).join('')}</div>`}else if(eligible.length===1){html+='<p class="subtle">只有一筆使用中庫存，已自動選取。</p>'}}
 }
 $('actionBody').innerHTML=html;$('actionConfirm').disabled=action!=='buy'&&!selectedBatch;if(!$('actionDialog').open)$('actionDialog').showModal();
}
function confirmStockAction(){const i=items.find(x=>x.id===currentAction?.id);if(!i)return;const action=currentAction.action;if(action==='buy'){
 const expiry=$('actionExpiry').value;window.lastActionExpiry=expiry;const b=i.batches.find(b=>b.expiry===expiry&&b.opened===0&&b.location==='');if(b)b.sealed+=actionQty;else i.batches.push({id:uid(),expiry,sealed:actionQty,opened:0,location:'',purchased:dayString()});
 }else{const b=i.batches.find(b=>b.id===selectedBatch);if(!b)return;if(action==='open'&&b.sealed>0){b.sealed--;const existing=i.batches.find(x=>x!==b&&x.expiry===b.expiry&&x.location===selectedLocation&&x.opened>0&&x.sealed===0);if(existing)existing.opened++;else i.batches.push({id:uid(),expiry:b.expiry,sealed:0,opened:1,location:selectedLocation,purchased:b.purchased||''})}
 if(action==='finish'&&b.opened>0)b.opened--;
 }i.batches=i.batches.filter(b=>b.sealed+b.opened>0);syncCounts(i);$('actionDialog').close();save()}
function changeLocation(itemId,batchId){const i=items.find(x=>x.id===itemId),b=i?.batches?.find(x=>x.id===batchId);if(!b||b.opened<1)return;const next=b.location==='新莊'?'桃園':'新莊';if(confirm('將這 '+b.opened+' 件使用中的商品地點改為「'+next+'」？')){b.location=next;save()}}
// Display an editable location button for each active opened batch.
const cardWithLocation=card;
card=function(i){let html=cardWithLocation(i);const locBtns=(i.batches||[]).filter(b=>b.opened>0).map(b=>`<button class="ghost" style="font-size:12px;margin:4px 4px 0 0" onclick="changeLocation('${i.id}','${b.id}')">📍 ${esc(b.location)} → ${b.location==='新莊'?'桃園':'新莊'}（${esc(b.expiry||'未記錄期限')}）</button>`).join('');return html.replace('</article>',`${locBtns?'<div class="subtle" style="margin-top:10px">點一下可搬移使用地點</div>'+locBtns:''}</article>`)};
// Preserve legacy data on edit. Changes to the numeric totals adjust an undated batch instead of destroying dated batches.
const originalSubmitHandler=$('form');
originalSubmitHandler.addEventListener('submit',()=>{},true);
// For editing, keep quantities in sync with dated batches through a capture handler.
originalSubmitHandler.addEventListener('submit',e=>{const id=$('itemId').value;if(!id)return;const i=items.find(x=>x.id===id);if(!i)return;const sealed=Number($('sealed').value),opened=Number($('opened').value);if(sealed!==i.sealed||opened!==i.opened){e.preventDefault();e.stopImmediatePropagation();alert('為了保留每批有效期限與使用地點，請使用商品卡片上的「進貨／開封／用完」調整數量。其他欄位仍可編輯。');return}i._editingBatches=i.batches;},true);
// Replace original submit behavior with a safe batch-preserving handler using a capturing listener.
originalSubmitHandler.addEventListener('submit',e=>{if(e.defaultPrevented)return;const id=$('itemId').value;const existing=items.find(x=>x.id===id);if(!existing)return;const batches=existing.batches;setTimeout(()=>{const updated=items.find(x=>x.id===id);if(updated){updated.batches=batches;syncCounts(updated);localStorage.setItem(key,JSON.stringify(items));render()}},0)},true);
// Show existing batch details in the edit dialog while keeping original form fields.
const originalOpenForm=openForm;
openForm=function(id){originalOpenForm(id);if(id){const i=items.find(x=>x.id===id);if(i){$('stockPreview').insertAdjacentHTML('beforeend','<div class="subtle">批次數量請從商品卡片的進貨／開封／用完按鈕調整。</div>')}}};
render();
</script>

<script>
// V5: special sanitary product categories and length/size specification.
const padTypes=['一般衛生棉','液體衛生棉','夜用衛生棉','安睡褲'];
const lifeCategory='生活用品類';
for(const t of padTypes){if(!cats[lifeCategory].includes(t))cats[lifeCategory].push(t)}
localStorage.setItem('mystock-cats-v2',JSON.stringify(cats));
function isPad(){return $('category')?.value===lifeCategory&&padTypes.includes($('subcategory')?.value)}
function updatePadSpecs(){const show=isPad();$('padSpecs')?.classList.toggle('hidden',!show);if($('padSize'))$('padSize').style.display=$('subcategory')?.value==='安睡褲'?'':'none'}
// Keep historical 衛生棉 entries intact; allow reclassification to one of the new types.
const v4Card=card;
card=function(i){let html=v4Card(i);if(i.padLength||i.padSize){const spec=[i.padLength?esc(String(i.padLength))+' 公分':'',i.padSize?'尺寸 '+esc(i.padSize):''].filter(Boolean).join(' · ');html=html.replace('<div class="counts">','<div class="subtle" style="margin:4px 0 9px">📏 '+spec+'</div><div class="counts">')}return html};
render();
</script>
</body></html>
